name: Android release

# Publishes downloadable APKs. Push a tag (e.g. `v0.1.0`) to cut a release, or
# run the workflow manually to get the APKs as build artifacts.
#
# For every release it publishes:
#   * paxby-<tag>-universal.apk    -> works on every device (largest)
#   * paxby-<tag>-arm64-v8a.apk    -> most phones since ~2016 (recommended)
#   * paxby-<tag>-armeabi-v7a.apk  -> older 32-bit phones
#   * paxby-<tag>-x86_64.apk       -> emulators / some Chromebooks
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish APKs
    runs-on: ubuntu-latest
    env:
      # Set these as repository secrets to sign with a real upload key. When
      # they are absent the build falls back to the debug key (still installable
      # by side-loading, but Play Protect will warn).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=1

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/findit-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/findit-release.keystore
          EOF

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect and name the APKs
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-dev}"
          out="dist"
          mkdir -p "$out"
          cp build/app/outputs/flutter-apk/app-release.apk             "$out/paxby-$tag-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "$out/paxby-$tag-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$out/paxby-$tag-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "$out/paxby-$tag-x86_64.apk"
          ls -lh "$out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paxby-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
