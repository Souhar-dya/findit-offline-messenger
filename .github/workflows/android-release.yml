name: Android release

# Publishes a downloadable APK. Push a tag (e.g. `v0.1.0`) to cut a release, or
# run the workflow manually to get the APK as a build artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK after the tag
        shell: bash
        run: |
          name="findit-${GITHUB_REF_NAME:-dev}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: findit-apk
          path: ${{ env.APK }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
