<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-label="Illustrative FindIt screens: consent, the Chats friend list, and a conversation with shared disappearing-message settings.">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1C1B1F" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1040" height="700" rx="28" fill="#F3F0F7"/>
  <g font-family="system-ui, 'Segoe UI', Roboto, sans-serif">

    <!-- ============ 1. Consent ============ -->
    <g transform="translate(60,36)">
      <rect width="300" height="600" rx="28" fill="#FFFFFF" stroke="#E6E1E5" filter="url(#soft)"/>
      <text x="24" y="44" font-size="15" font-weight="700" fill="#1C1B1F">Consent &amp; terms of use</text>
      <line x1="0" y1="58" x2="300" y2="58" stroke="#E6E1E5"/>

      <circle cx="150" cy="110" r="26" fill="#EADDFF"/>
      <g transform="translate(150,112)">
        <path d="M-7 0 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#21005D" stroke-width="3"/>
        <rect x="-10" y="0" width="20" height="15" rx="3" fill="#21005D"/>
      </g>

      <text x="24" y="168" font-size="11" fill="#49454F">FindIt is an offline-first messenger. Nothing</text>
      <text x="24" y="184" font-size="11" fill="#49454F">is exchanged until you accept these terms.</text>

      <text x="24" y="214" font-size="12" font-weight="700" fill="#1C1B1F">What leaves your device</text>
      <text x="24" y="232" font-size="11" fill="#49454F">Messages are signed and end-to-end encrypted.</text>
      <text x="24" y="248" font-size="11" fill="#49454F">Nearby phones cannot read their contents.</text>

      <text x="24" y="278" font-size="12" font-weight="700" fill="#1C1B1F">Chat with accepted friends</text>
      <text x="24" y="296" font-size="11" fill="#49454F">You control when nearby networking is on.</text>

      <text x="24" y="326" font-size="12" font-weight="700" fill="#1C1B1F">Shared message settings</text>
      <text x="24" y="344" font-size="11" fill="#49454F">Retention changes require both users to agree.</text>

      <rect x="24" y="392" width="16" height="16" rx="3" fill="#6750A4"/>
      <path d="M28 400 l3 3 5 -6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="48" y="405" font-size="11" fill="#1C1B1F">I have read and agree.</text>

      <line x1="0" y1="424" x2="300" y2="424" stroke="#E6E1E5"/>
      <rect x="24" y="440" width="252" height="42" rx="21" fill="#6750A4"/>
      <text x="150" y="466" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Agree and continue</text>
      <text x="150" y="506" font-size="10" fill="#79747E" text-anchor="middle">Declining keeps the app here — nothing is sent.</text>
    </g>

    <!-- ============ 2. Chats and friend launcher ============ -->
    <g transform="translate(390,36)">
      <rect width="300" height="600" rx="28" fill="#FFFFFF" stroke="#E6E1E5" filter="url(#soft)"/>
      <text x="24" y="44" font-size="16" font-weight="700" fill="#1C1B1F">Chats</text>
      <line x1="0" y1="58" x2="300" y2="58" stroke="#E6E1E5"/>
      <text x="20" y="88" font-size="12" font-weight="700" fill="#1C1B1F">Friends</text>
      <circle cx="54" cy="119" r="20" fill="#EADDFF"/>
      <circle cx="126" cy="119" r="20" fill="#E7E0EC"/>
      <circle cx="198" cy="119" r="20" fill="#DDEBE3"/>
      <text x="54" y="124" font-size="12" font-weight="700" fill="#21005D" text-anchor="middle">A</text>
      <text x="126" y="124" font-size="12" font-weight="700" fill="#49454F" text-anchor="middle">B</text>
      <text x="198" y="124" font-size="12" font-weight="700" fill="#315B44" text-anchor="middle">C</text>
      <text x="54" y="153" font-size="9" fill="#49454F" text-anchor="middle">Ada</text>
      <text x="126" y="153" font-size="9" fill="#49454F" text-anchor="middle">Ben</text>
      <text x="198" y="153" font-size="9" fill="#49454F" text-anchor="middle">Casey</text>
      <line x1="0" y1="170" x2="300" y2="170" stroke="#E6E1E5"/>
      <text x="20" y="198" font-size="12" font-weight="700" fill="#1C1B1F">Recent chats</text>
      <circle cx="44" cy="235" r="20" fill="#EADDFF"/>
      <text x="44" y="240" font-size="12" font-weight="700" fill="#21005D" text-anchor="middle">A</text>
      <text x="76" y="232" font-size="12" font-weight="700" fill="#1C1B1F">Ada</text>
      <text x="76" y="250" font-size="10" fill="#79747E">PNG &#x2022; disappears in 24 hours</text>
      <text x="272" y="232" font-size="9" fill="#79747E" text-anchor="end">now</text>
      <line x1="76" y1="268" x2="280" y2="268" stroke="#E6E1E5"/>
      <circle cx="44" cy="300" r="20" fill="#E7E0EC"/>
      <text x="44" y="305" font-size="12" font-weight="700" fill="#49454F" text-anchor="middle">B</text>
      <text x="76" y="297" font-size="12" font-weight="700" fill="#1C1B1F">Ben</text>
      <text x="76" y="315" font-size="10" fill="#79747E">See you soon</text>
      <text x="272" y="297" font-size="9" fill="#79747E" text-anchor="end">yesterday</text>
      <text x="150" y="424" font-size="10" fill="#79747E" text-anchor="middle">Friends stay here to start new chats.</text>
    </g>

    <!-- ============ 3. Chat ============ -->
    <g transform="translate(720,36)">
      <rect width="300" height="600" rx="28" fill="#FFFFFF" stroke="#E6E1E5" filter="url(#soft)"/>
      <text x="24" y="40" font-size="15" font-weight="700" fill="#1C1B1F">Ada</text>
      <text x="24" y="56" font-size="10" fill="#79747E">Friend</text>
      <line x1="0" y1="68" x2="300" y2="68" stroke="#E6E1E5"/>

      <rect x="16" y="78" width="268" height="52" rx="10" fill="#F7F2FA" stroke="#E6E1E5"/>
      <text x="28" y="99" font-size="11" font-weight="700" fill="#1C1B1F">Disappearing messages</text>
      <text x="28" y="116" font-size="9" fill="#79747E">Both copies delete after 24 hours</text>
      <rect x="238" y="91" width="34" height="20" rx="10" fill="#6750A4"/>
      <circle cx="261" cy="101" r="7" fill="#FFFFFF"/>

      <rect x="120" y="144" width="156" height="38" rx="16" fill="#6750A4"/>
      <text x="198" y="168" font-size="11" fill="#FFFFFF" text-anchor="middle">Are you nearby?</text>

      <rect x="24" y="194" width="150" height="38" rx="16" fill="#E7E0EC"/>
      <text x="99" y="218" font-size="11" fill="#1C1B1F" text-anchor="middle">Yes! Sending a PNG</text>

      <rect x="24" y="242" width="150" height="94" rx="14" fill="#EADDFF"/>
      <g transform="translate(99,288)">
        <rect x="-34" y="-24" width="68" height="48" rx="8" fill="#6750A4" opacity="0.35"/>
        <circle cx="-14" cy="-6" r="6" fill="#FFFFFF"/>
        <path d="M-34 16 L-12 -4 L2 10 L14 -2 L34 16 Z" fill="#FFFFFF" opacity="0.85"/>
      </g>
      <text x="150" y="326" font-size="10" font-weight="600" fill="#21005D" text-anchor="middle">PNG</text>

      <rect x="150" y="352" width="126" height="38" rx="16" fill="#6750A4"/>
      <text x="213" y="376" font-size="11" fill="#FFFFFF" text-anchor="middle">Got it &#x2713;</text>

      <rect x="16" y="536" width="268" height="44" rx="22" fill="#F7F2FA" stroke="#E6E1E5"/>
      <text x="40" y="563" font-size="11" fill="#79747E">Message</text>
      <circle cx="262" cy="558" r="16" fill="#6750A4"/>
      <path d="M255 558 l13 -5 -5 13 -2 -6 z" fill="#FFFFFF"/>
    </g>

    <text x="210" y="676" font-size="13" font-weight="600" fill="#49454F" text-anchor="middle">1. Accept the terms</text>
    <text x="540" y="676" font-size="13" font-weight="600" fill="#49454F" text-anchor="middle">2. Pick a friend in Chats</text>
    <text x="870" y="676" font-size="13" font-weight="600" fill="#49454F" text-anchor="middle">3. Agree on chat settings</text>
  </g>
</svg>
