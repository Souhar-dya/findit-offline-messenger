<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title description">
  <title id="title">How a FindIt message travels</title>
  <desc id="description">An encrypted message goes directly between two nearby phones or through another FindIt phone. The relay cannot read it. No server or internet is needed.</desc>
  <defs>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#6750A4"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#28775A"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="418" rx="24" fill="#FBF9FC" stroke="#E6E1E5"/>
  <g font-family="system-ui, Segoe UI, Roboto, sans-serif">
    <text x="520" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#1C1B1F">Messages move phone to phone</text>
    <rect x="428" y="58" width="184" height="30" rx="15" fill="#FCE8E6"/>
    <path d="M449 67v12m-6-6h12" stroke="#B3261E" stroke-width="2" stroke-linecap="round" transform="rotate(45 449 73)"/>
    <text x="525" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#8C1D18">No server · no cloud · no account</text>

    <!-- sender -->
    <g>
      <rect x="70" y="116" width="210" height="190" rx="18" fill="#F1ECF7" stroke="#D8CDE8"/>
      <rect x="145" y="132" width="60" height="104" rx="11" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
      <rect x="163" y="140" width="24" height="3" rx="1.5" fill="#79747E"/>
      <rect x="153" y="157" width="44" height="27" rx="9" fill="#6750A4"/>
      <text x="175" y="174" text-anchor="middle" font-size="9" fill="#FFFFFF">Hi Ben!</text>
      <text x="175" y="219" text-anchor="middle" font-size="8" fill="#49454F">•••</text>
      <text x="175" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B1F">You</text>
      <text x="175" y="285" text-anchor="middle" font-size="11" fill="#49454F">message is encrypted</text>
    </g>

    <!-- optional carrier -->
    <g>
      <rect x="415" y="116" width="210" height="190" rx="18" fill="#FFFFFF" stroke="#D8CDE8"/>
      <rect x="490" y="132" width="60" height="104" rx="11" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
      <rect x="508" y="140" width="24" height="3" rx="1.5" fill="#79747E"/>
      <path d="M505 174h30v23h-30z" fill="#EADDFF" stroke="#6750A4" stroke-width="1.5"/>
      <path d="m505 176 15 12 15-12" fill="none" stroke="#6750A4" stroke-width="1.5"/>
      <rect x="514" y="184" width="12" height="12" rx="2" fill="#21005D"/>
      <path d="M516 184v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#21005D" stroke-width="2"/>
      <text x="520" y="219" text-anchor="middle" font-size="9" fill="#49454F">can't read it</text>
      <text x="520" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B1F">Passing phone</text>
      <text x="520" y="285" text-anchor="middle" font-size="11" fill="#49454F">carries the locked message</text>
    </g>

    <!-- recipient -->
    <g>
      <rect x="760" y="116" width="210" height="190" rx="18" fill="#F1ECF7" stroke="#D8CDE8"/>
      <rect x="835" y="132" width="60" height="104" rx="11" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
      <rect x="853" y="140" width="24" height="3" rx="1.5" fill="#79747E"/>
      <rect x="843" y="157" width="44" height="27" rx="9" fill="#EADDFF"/>
      <text x="865" y="174" text-anchor="middle" font-size="9" fill="#21005D">Hi Ben!</text>
      <text x="865" y="219" text-anchor="middle" font-size="8" fill="#49454F">•••</text>
      <text x="865" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B1F">Friend</text>
      <text x="865" y="285" text-anchor="middle" font-size="11" fill="#49454F">opens it with their key</text>
    </g>

    <!-- store-carry-forward path -->
    <path d="M292 169h111" fill="none" stroke="#6750A4" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
    <path d="M637 169h111" fill="none" stroke="#6750A4" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
    <text x="347" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#49454F">encrypted</text>
    <text x="692" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#49454F">encrypted</text>

    <!-- direct route -->
    <path d="M175 333v25h690v-25" fill="none" stroke="#28775A" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
    <rect x="441" y="344" width="158" height="26" rx="13" fill="#E7F3ED"/>
    <text x="520" y="361" text-anchor="middle" font-size="11" font-weight="600" fill="#205C46">or send directly nearby</text>
    <text x="520" y="397" text-anchor="middle" font-size="11" fill="#49454F">No internet required · Bluetooth is not used · forwarding happens only when FindIt is switched on</text>
  </g>
</svg>
